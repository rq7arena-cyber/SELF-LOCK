name: Build Selflock APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o SelfLock-Final-Fixed.zip -d src
          ls src

      - name: Fix gradle properties
        run: |
          echo "android.useAndroidX=true" >> src/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" >> src/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx2g" >> src/gradle.properties
          cat src/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: src
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          GRADLE_OPTS: -Xmx3g -Dfile.encoding=UTF-8
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: selflock-apk
          path: src/app/build/outputs/apk/debug/*.apk
